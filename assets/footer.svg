<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Let's build something reliable. Open to Senior QA and SQC roles.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ca8cc" stroke-opacity=".07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="120%" r="70%">
      <stop offset="0" stop-color="#34e5c9" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#8b7bff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#34e5c9"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="210" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
    .disp { font-family: 'Space Grotesk', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .blink { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="210" fill="#060911"/>
    <rect width="900" height="210" fill="url(#grid)"/>
    <rect width="900" height="210" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="209" rx="15.5" fill="none" stroke="#8ca8cc" stroke-opacity=".18"/>

  <text x="450" y="78" class="disp" font-size="32" font-weight="700" fill="#e7ecf4" text-anchor="middle">Let's build something <tspan fill="url(#grad)">reliable.</tspan></text>
  <text x="450" y="112" class="mono" font-size="13" fill="#8a96ab" text-anchor="middle">Open to Senior QA / SQC roles · backend · API · frontend testing</text>
  <text x="450" y="166" class="mono" font-size="12" fill="#5d6a80" text-anchor="middle"><tspan fill="#34e5c9">$</tspan> exit <tspan fill="#34e5c9">0</tspan>  ·  Riyadh, Saudi Arabia  ·  built with a focus on quality, naturally<tspan class="blink" fill="#34e5c9"> ▍</tspan></text>
</svg>
