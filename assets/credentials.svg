<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Credentials: ISTQB CTFL, CT-MAT and CTFL-AT; Scrum.org PSM I, PSM II and PSPO I. Education: B.Sc. Software Engineering, Jordan University of Science and Technology. IELTS Academic.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ca8cc" stroke-opacity=".06"/>
    </pattern>
    <radialGradient id="glow" cx="100%" cy="100%" r="60%">
      <stop offset="0" stop-color="#34e5c9" stop-opacity=".14"/>
      <stop offset="1" stop-color="#34e5c9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="900" height="420" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
    .disp { font-family: 'Space Grotesk', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .body { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .c { animation: in .55s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .tile { fill: #0d1420; stroke: #8ca8cc; stroke-opacity: .14; }
    .ico { fill: #34e5c9; fill-opacity: .12; stroke: #34e5c9; stroke-opacity: .45; }
    .icoV { fill: #8b7bff; fill-opacity: .12; stroke: #8b7bff; stroke-opacity: .45; }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="420" fill="#060911"/>
    <rect width="900" height="420" fill="url(#grid)"/>
    <rect width="900" height="420" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="419" rx="15.5" fill="none" stroke="#8ca8cc" stroke-opacity=".18"/>

  <text x="40" y="46" class="mono" font-size="11.5" fill="#34e5c9" letter-spacing="2.5">CREDENTIALS</text>
  <text x="40" y="80" class="disp" font-size="24" font-weight="700" fill="#e7ecf4">Certified across testing and agile delivery.</text>

  <!-- row 1: ISTQB -->
  <g class="c" style="animation-delay:.2s">
    <rect class="tile" x="40" y="108" width="262" height="76" rx="12"/>
    <rect class="ico" x="56" y="124" width="44" height="44" rx="10"/>
    <text x="78" y="151" class="mono" font-size="13" font-weight="700" fill="#34e5c9" text-anchor="middle">FL</text>
    <text x="116" y="142" class="disp" font-size="15.5" font-weight="700" fill="#e7ecf4">ISTQB® CTFL</text>
    <text x="116" y="163" class="body" font-size="12.5" fill="#8a96ab">Foundation Level</text>
  </g>
  <g class="c" style="animation-delay:.35s">
    <rect class="tile" x="319" y="108" width="262" height="76" rx="12"/>
    <rect class="ico" x="335" y="124" width="44" height="44" rx="10"/>
    <text x="357" y="151" class="mono" font-size="13" font-weight="700" fill="#34e5c9" text-anchor="middle">MA</text>
    <text x="395" y="142" class="disp" font-size="15.5" font-weight="700" fill="#e7ecf4">ISTQB® CT-MAT</text>
    <text x="395" y="163" class="body" font-size="12.5" fill="#8a96ab">Mobile Application Testing</text>
  </g>
  <g class="c" style="animation-delay:.5s">
    <rect class="tile" x="598" y="108" width="262" height="76" rx="12"/>
    <rect class="ico" x="614" y="124" width="44" height="44" rx="10"/>
    <text x="636" y="151" class="mono" font-size="13" font-weight="700" fill="#34e5c9" text-anchor="middle">AT</text>
    <text x="674" y="142" class="disp" font-size="15.5" font-weight="700" fill="#e7ecf4">ISTQB® CTFL-AT</text>
    <text x="674" y="163" class="body" font-size="12.5" fill="#8a96ab">Agile Tester Extension</text>
  </g>

  <!-- row 2: Scrum.org -->
  <g class="c" style="animation-delay:.65s">
    <rect class="tile" x="40" y="200" width="262" height="76" rx="12"/>
    <rect class="icoV" x="56" y="216" width="44" height="44" rx="10"/>
    <text x="78" y="243" class="mono" font-size="13" font-weight="700" fill="#8b7bff" text-anchor="middle">S1</text>
    <text x="116" y="234" class="disp" font-size="15.5" font-weight="700" fill="#e7ecf4">PSM I</text>
    <text x="116" y="255" class="body" font-size="12.5" fill="#8a96ab">Professional Scrum Master</text>
  </g>
  <g class="c" style="animation-delay:.8s">
    <rect class="tile" x="319" y="200" width="262" height="76" rx="12"/>
    <rect class="icoV" x="335" y="216" width="44" height="44" rx="10"/>
    <text x="357" y="243" class="mono" font-size="13" font-weight="700" fill="#8b7bff" text-anchor="middle">S2</text>
    <text x="395" y="234" class="disp" font-size="15.5" font-weight="700" fill="#e7ecf4">PSM II</text>
    <text x="395" y="255" class="body" font-size="12.5" fill="#8a96ab">Advanced Scrum Master</text>
  </g>
  <g class="c" style="animation-delay:.95s">
    <rect class="tile" x="598" y="200" width="262" height="76" rx="12"/>
    <rect class="icoV" x="614" y="216" width="44" height="44" rx="10"/>
    <text x="636" y="243" class="mono" font-size="13" font-weight="700" fill="#8b7bff" text-anchor="middle">PO</text>
    <text x="674" y="234" class="disp" font-size="15.5" font-weight="700" fill="#e7ecf4">PSPO I</text>
    <text x="674" y="255" class="body" font-size="12.5" fill="#8a96ab">Professional Product Owner</text>
  </g>

  <!-- education -->
  <g class="c" style="animation-delay:1.15s">
    <rect x="40" y="300" width="820" height="84" rx="12" fill="#0f1826" stroke="#ffb454" stroke-opacity=".3"/>
    <rect x="56" y="320" width="44" height="44" rx="10" fill="#ffb454" fill-opacity=".12" stroke="#ffb454" stroke-opacity=".45"/>
    <text x="78" y="347" class="mono" font-size="13" font-weight="700" fill="#ffb454" text-anchor="middle">SE</text>
    <text x="116" y="320" class="mono" font-size="10.5" fill="#ffb454" letter-spacing="2" dy="0">EDUCATION</text>
    <text x="116" y="343" class="disp" font-size="16.5" font-weight="700" fill="#e7ecf4">B.Sc. Software Engineering</text>
    <text x="116" y="364" class="body" font-size="12.5" fill="#8a96ab">Jordan University of Science and Technology (JUST) · Jordan</text>
    <text x="844" y="343" class="disp" font-size="14" font-weight="700" fill="#e7ecf4" text-anchor="end">IELTS Academic</text>
    <text x="844" y="364" class="body" font-size="12.5" fill="#8a96ab" text-anchor="end">English proficiency</text>
  </g>
</svg>
